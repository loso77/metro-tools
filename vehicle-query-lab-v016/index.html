/* 竖屏默认：左右容器正常堆叠，不影响原布局 */
.card-left, .card-right { width: 100%; }

/* 翻页模式：竖屏查询成功后只显示结果页 */
@media (orientation: portrait) {
  body.paged-mode:not(.result-page) .card-right {
    display: none;
  }
  body.result-page {
    justify-content: flex-start;
    padding-top: 12px;
  }
  body.result-page > h1,
  body.result-page > .subtitle {
    display: none;
  }
  body.result-page .card {
    padding-top: 14px;
  }
  body.result-page .card-left {
    display: none;
  }
  body.result-page .card-right {
    display: block;
    width: 100%;
  }
  body.result-page .result-page-head {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin: -4px 0 8px;
    padding: 4px 0 10px;
    background: #fff;
    border-bottom: 1px solid #edf2f7;
  }
}

/* 横屏布局：左右分栏 */
@media (orientation: landscape) and (max-height: 600px) {
  body { padding: 10px; }
  h1 { font-size: 18px; margin: 4px 0; }
  .subtitle { font-size: 12px; margin-bottom: 8px; }
  .card {
    display: flex;
    gap: 20px;
    align-items: flex-start;
    max-width: 100%;
  }
  .card-left {
    width: 42%;
    flex-shrink: 0;
    position: relative;
  }
  .card-right {
    width: 58%;
    border-left: 1px solid #edf2f7;
    padding-left: 20px;
    min-height: 200px;
  }
  /* 时钟缩小放角落 */
  .clock { font-size: 22px; text-align: left; }
  .date-label { font-size: 11px; text-align: left; margin-bottom: 10px; }
  .mode-tabs { margin-bottom: 12px; }
  .input-label { margin-top: 8px; }
  .import-section { margin-top: 14px; padding-top: 12px; }
  /* 结果区不要顶部分割线重复 */
  .card-right .divider { display: none; }
  .result-page-head { display: none !important; }
}

.srcol-item.sr-next {
