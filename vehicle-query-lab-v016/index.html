// ====== 数据源管理（平日/双休日双套）======
const STORE = {
  weekday: { key:'pr_weekday_data', name:'pr_weekday_name', builtin: BUILTIN_DATA, defaultName:'内置平日图 (PR2607)' },
  weekend: { key:'pr_weekend_data', name:'pr_weekend_name', builtin: BUILTIN_WEEKEND, defaultName:'内置双休日图 (SX2608)' }
};

let mode = 'weekday';           // 当前模式
let DATA = BUILTIN_DATA;
let EXTRA = BUILTIN_EXTRA_WD;  // 当前模式的加开车次数据        // 当前生效数据
let DATA_NAME = STORE.weekday.defaultName;
let hasActiveQuery = false;
const RESULT_VIEW_MODE_KEY = 'pr_result_view_mode';
let resultViewMode = 'paged';
let pendingResultPageOpen = false;
try {
  const savedResultViewMode = localStorage.getItem(RESULT_VIEW_MODE_KEY);
  if (savedResultViewMode === 'paged' || savedResultViewMode === 'continuous') {
    resultViewMode = savedResultViewMode;
  }
} catch(e) {}

// 凌晨3点前仍按前一运营日判断平日/双休日
function getServiceDayInfo(now = new Date()) {
  const d = new Date(now.getTime());
  if (d.getHours() < 3) d.setDate(d.getDate() - 1);
  const pad = n => String(n).padStart(2, '0');
  return {
    key: d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()),
    mode: (d.getDay() === 0 || d.getDay() === 6) ? 'weekend' : 'weekday'
  };
}

// 各套数据的运行时缓存
const loaded = { weekday: BUILTIN_DATA, weekend: BUILTIN_WEEKEND };
  const loadedExtra = { weekday: BUILTIN_EXTRA_WD, weekend: BUILTIN_EXTRA_WE };
const loadedName = { weekday: STORE.weekday.defaultName, weekend: STORE.weekend.defaultName };

(function initLoad() {
  // 读取本地存储
  for (const m of ['weekday','weekend']) {
    try {
      const d = localStorage.getItem(STORE[m].key);
      if (d) {
        loaded[m] = JSON.parse(d);
        loadedName[m] = localStorage.getItem(STORE[m].name) || '已导入';
        const ex = localStorage.getItem(STORE[m].key + '_extra');
        loadedExtra[m] = ex ? JSON.parse(ex) : {};
      }
    } catch(e) {}
  }
  // 同一运营日恢复人工选择；新运营日按日期自动选择
  try {
    const serviceDay = getServiceDayInfo();
    const lastMode = localStorage.getItem('pr_mode');
    const lastModeDate = localStorage.getItem('pr_mode_date');
    if (lastModeDate === serviceDay.key && (lastMode === 'weekend' || lastMode === 'weekday')) {
      mode = lastMode;
    } else {
      mode = serviceDay.mode;
    }
  } catch(e) {}
  applyMode(mode);
  applyResultViewMode();
})();

function isPortraitLayout() {
  return window.matchMedia
    ? window.matchMedia('(orientation: portrait)').matches
    : window.innerHeight >= window.innerWidth;
}

function hasUsableResult() {
  const result = document.getElementById('result');
  return !!(result && result.textContent.trim() && !result.querySelector('.error-msg'));
}

function setQueryPageMessage(message = '') {
  const box = document.getElementById('queryPageMessage');
  if (!box) return;
  const shouldShow = resultViewMode === 'paged' && !!message;
  box.textContent = shouldShow ? message : '';
  box.classList.toggle('visible', shouldShow);
}

function applyResultViewMode() {
  const paged = document.getElementById('viewModePaged');
  const continuous = document.getElementById('viewModeContinuous');
  document.body.classList.toggle('paged-mode', resultViewMode === 'paged');
  if (paged) {
    paged.classList.toggle('active', resultViewMode === 'paged');
    paged.setAttribute('aria-pressed', String(resultViewMode === 'paged'));
  }
  if (continuous) {
    continuous.classList.toggle('active', resultViewMode === 'continuous');
    continuous.setAttribute('aria-pressed', String(resultViewMode === 'continuous'));
  }
  const error = document.querySelector('#result .error-msg');
  setQueryPageMessage(error ? error.textContent.trim() : '');
}

function setResultViewMode(nextMode) {
  if (nextMode !== 'paged' && nextMode !== 'continuous') return;
  resultViewMode = nextMode;
  pendingResultPageOpen = false;
  try { localStorage.setItem(RESULT_VIEW_MODE_KEY, nextMode); } catch(e) {}
  applyResultViewMode();

  if (nextMode === 'continuous') {
    showQueryPage();
  } else if (hasUsableResult()) {
    showResultPage();
  }
}

function showResultPage() {
  if (resultViewMode !== 'paged' || !isPortraitLayout() || !hasUsableResult()) return;
  document.body.classList.add('result-page');
  pendingResultPageOpen = false;
  window.scrollTo({ top: 0, behavior: 'auto' });
}

function showQueryPage(shouldScroll = true) {
  document.body.classList.remove('result-page');
  pendingResultPageOpen = false;
  if (shouldScroll) window.scrollTo({ top: 0, behavior: 'auto' });
}

function applyMode(m) {
  mode = m;
  DATA = loaded[m] || {};
  EXTRA = loadedExtra[m] || {};
  DATA_NAME = loadedName[m];
  try {
    localStorage.setItem('pr_mode', m);
    localStorage.setItem('pr_mode_date', getServiceDayInfo().key);
  } catch(e) {}
  // 更新标签高亮
  const wd = document.getElementById('tabWeekday');
  const we = document.getElementById('tabWeekend');
  if (wd && we) {
    wd.classList.toggle('active', m==='weekday');
    we.classList.toggle('active', m==='weekend');
  }
  updateDataLabel();
  // 切换模式时清空查询结果
  const res = document.getElementById('result');
  const hint = document.getElementById('hint');
  hasActiveQuery = false;
  if (res) res.innerHTML = '';
  if (hint) hint.style.display = 'block';
  setQueryPageMessage();
  showQueryPage(false);
}

function switchMode(m) {
  applyMode(m);
  if (window.__stationOptionsReady) refreshStationOptions();
}

function updateDataLabel() {
  const el = document.getElementById('dataSource');
  if (el) el.textContent = '当前数据：' + DATA_NAME;
  // 若当前模式无数据，提示
  const noData = !DATA || Object.keys(DATA).length === 0;
  const importHint = document.getElementById('noDataHint');
  if (importHint) importHint.style.display = noData ? 'block' : 'none';
}

// 解析上传的 Excel
function parseWorkbook(workbook) {
  const grouped = {};
  const extras = {};
  const stats = { added: 0, invalid: 0, candidate: 0, emptySheets: 0 };
  workbook.SheetNames.forEach(sheetName => {
    const ws = workbook.Sheets[sheetName];
    const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:false, defval:''});
    const before = stats.added;
    // 不再固定跳过第一行：标题行会自动忽略，因此允许Excel前面增加说明行
    for (let i = 0; i < rows.length; i++) {
      const row = rows[i];
      parseHalf(row, 1, 2, 3, 4, 5, 'down', sheetName, grouped, extras, stats);
      parseHalf(row, 10, 11, 12, 13, 14, 'up', sheetName, grouped, extras, stats);
    }
    if (stats.added === before) stats.emptySheets++;
  });
  Object.keys(grouped).forEach(t => {
    grouped[t].sort((a,b) => a.a < b.a ? -1 : (a.a > b.a ? 1 : 0));
  });
  Object.keys(extras).forEach(c => {
    extras[c].sort((a,b) => a.a < b.a ? -1 : (a.a > b.a ? 1 : 0));
  });
  return { grouped, extras, stats };
}

function safeImportedText(value) {
  return String(value == null ? '' : value).trim()
    .replace(/</g, '＜').replace(/>/g, '＞').replace(/&/g, '＆');
}

function parseHalf(row, ci_train, ci_o, ci_e, ci_a, ci_p, dir, station, grouped, extras, stats) {
  let id = String(row[ci_train] == null ? '' : row[ci_train]).trim();
  if (!id || /^(nan|车次|表号)$/i.test(id)) return;
  if (!/^[0-9]+$/.test(id)) return;
  stats.candidate++;
  let a = String(row[ci_a] == null ? '' : row[ci_a]).trim();
  let p = String(row[ci_p] == null ? '' : row[ci_p]).trim();
  if (!a || !p || /^nan$/i.test(a) || /^nan$/i.test(p)) { stats.invalid++; return; }
  a = normTime(a); p = normTime(p);
  if (!a || !p) { stats.invalid++; return; }
  const o = safeImportedText(row[ci_o]);
  const e = safeImportedText(row[ci_e]);
  const safeStation = safeImportedText(station);

  if (id.length >= 5 && /^[0-9]+$/.test(id.slice(0,-4)) && /^[0-9]{4}$/.test(id.slice(-4))) {
    // 正常：前缀表号 + 后4位车次
    const table = id.slice(0,-4), train = id.slice(-4);
    if (!grouped[table]) grouped[table] = [];
    grouped[table].push({ s: safeStation, d: dir, t: table, c: train, o, e, a, p });
    stats.added++;
  } else if (id.length <= 3 && /^[0-9]+$/.test(id)) {
    // 1~3位表号(轧道车或无车次记录)
    const table = id.length < 2 ? id.padStart(2,'0') : id;
    if (!grouped[table]) grouped[table] = [];
    grouped[table].push({ s: safeStation, d: dir, t: table, c: '', o, e, a, p });
    stats.added++;
  } else if (id.length === 4 && /^[0-9]+$/.test(id)) {
    // 第二类：4位车次，无表号(加开车)
    if (extras) {
      if (!extras[id]) extras[id] = [];
      extras[id].push({ s: safeStation, d: dir, t: '', c: id, o, e, a, p });
      stats.added++;
    }
  } else {
    stats.invalid++;
  }
}

function normTime(t) {
  t = String(t).trim();
  if (/^[0-9]*\.?[0-9]+$/.test(t) && t.indexOf(':') === -1) {
    const f = parseFloat(t);
    if (f >= 0 && f < 1) {
      let sec = Math.round(f * 86400);
      if (sec >= 86400) sec = 0;
      const hh = String(Math.floor(sec/3600)).padStart(2,'0');
      const mm = String(Math.floor((sec%3600)/60)).padStart(2,'0');
      const ss = String(sec%60).padStart(2,'0');
      return hh+':'+mm+':'+ss;
    }
  }
  const m = t.match(/^(\d{1,2}):(\d{1,2})(?::(\d{1,2}))?$/);
  if (!m) return '';
  const h = Number(m[1]), min = Number(m[2]), sec = Number(m[3] || 0);
  if (h > 23 || min > 59 || sec > 59) return '';
  return String(h).padStart(2,'0')+':'+String(min).padStart(2,'0')+':'+String(sec).padStart(2,'0');
}

// 三项要么全部保存，要么恢复原状，避免刷新后只剩“半套运行图”
function saveScheduleAtomically(targetMode, grouped, extras, fileName) {
  const keys = [STORE[targetMode].key, STORE[targetMode].key + '_extra', STORE[targetMode].name];
  const oldValues = keys.map(k => localStorage.getItem(k));
  const newValues = [JSON.stringify(grouped), JSON.stringify(extras), fileName];
  try {
    keys.forEach((k, i) => localStorage.setItem(k, newValues[i]));
    return true;
  } catch (err) {
    try {
      keys.forEach(k => localStorage.removeItem(k));
      keys.forEach((k, i) => {
        if (oldValues[i] !== null) localStorage.setItem(k, oldValues[i]);
      });
    } catch (rollbackErr) {}
    return false;
  }
}

function handleFile(input) {
  const file = input.files[0];
  if (!file) return;
  const statusEl = document.getElementById('importStatus');
  const targetMode = mode; // 导入到当前选中的模式
  const modeLabel = targetMode === 'weekday' ? '平日' : '双休日';
  statusEl.textContent = '正在解析 ' + file.name + ' （' + modeLabel + '）...';
  statusEl.style.color = '#718096';

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const wb = XLSX.read(e.target.result, {type:'array'});
      const parsed = parseWorkbook(wb);
      const grouped = parsed.grouped;
      const extras = parsed.extras;
      const stats = parsed.stats;
      const tableCount = Object.keys(grouped).length;
      if (tableCount === 0 || stats.added < 10) {
        statusEl.textContent = '⚠️ 有效记录过少，请检查工作表名称和B—F、K—O列格式';
        statusEl.style.color = '#e53e3e';
        return;
      }
      loaded[targetMode] = grouped;
      loadedExtra[targetMode] = extras;
      loadedName[targetMode] = file.name;
      const saved = saveScheduleAtomically(targetMode, grouped, extras, file.name);
      if (targetMode === mode) { DATA = grouped; EXTRA = extras; DATA_NAME = file.name; }
      updateDataLabel();
      if (window.__stationOptionsReady) refreshStationOptions();
      const skipped = stats.invalid ? '，跳过 '+stats.invalid+' 条异常记录' : '';
      statusEl.textContent = (saved ? '✅ ' : '⚠️ ') + modeLabel + '运行图导入成功：' + tableCount + ' 个表号、' + stats.added + ' 条记录' + skipped + (saved ? '，已完整保存' : '（存储空间不足，本次仅临时生效）');
      statusEl.style.color = saved ? '#38a169' : '#d69e2e';
    } catch(err) {
      statusEl.textContent = '❌ 解析失败：' + err.message;
      statusEl.style.color = '#e53e3e';
    }
    input.value = '';
  };
  reader.readAsArrayBuffer(file);
}

function resetCurrent() {
  const modeLabel = mode === 'weekday' ? '平日' : '双休日';
  if (!confirm('确定清除当前【' + modeLabel + '】已导入的运行图？')) return;
  try {
    localStorage.removeItem(STORE[mode].key);
    localStorage.removeItem(STORE[mode].key + '_extra');
    localStorage.removeItem(STORE[mode].name);
  } catch(e) {}
  if (mode === 'weekday') {
    loaded.weekday = BUILTIN_DATA;
    loadedExtra.weekday = BUILTIN_EXTRA_WD;
    loadedName.weekday = STORE.weekday.defaultName;
  } else {

    loadedName.weekend = STORE.weekend.defaultName;
  }

}

function toSec(t) {
  const p = t.split(':').map(Number);
  return p[0]*3600 + p[1]*60 + (p[2]||0);
}
function isTimeInRange(sec, start, end, inclusive = true) {
  if (start <= end) return inclusive ? (sec >= start && sec <= end) : (sec > start && sec < end);
  return inclusive ? (sec >= start || sec <= end) : (sec > start || sec < end);
}
function nowSec() {
  const n = new Date();
  return n.getHours()*3600 + n.getMinutes()*60 + n.getSeconds();
}
function nowStr() {
  const n = new Date(), pad = x => String(x).padStart(2,'0');
  return pad(n.getHours())+':'+pad(n.getMinutes())+':'+pad(n.getSeconds());
}
function dirTag(d) {

    ? '<span class="dir-tag dir-down">下行 ▼</span>'
    : '<span class="dir-tag dir-up">上行 ▲</span>';
}



// 读取通用查询时间：未填写时使用当前时间
function getQueryTime() {
  const hourInput = document.getElementById('stationHour');
  const minuteInput = document.getElementById('stationMinute');
  const hourRaw = hourInput ? hourInput.value : '';
  const minuteRaw = minuteInput ? minuteInput.value : '';
  if (!hourRaw && !minuteRaw) return { sec: nowSec(), text: nowStr(), custom: false };
  if (!hourRaw) return null;
  const h = Number(hourRaw), min = minuteRaw ? Number(minuteRaw) : 0;
  if (h > 23 || min > 59) return null;
  const pad = n => String(n).padStart(2, '0');
  return { sec: h * 3600 + min * 60, text: pad(h)+':'+pad(min), custom: true };
}

// 站点看板：每方向显示 即将到达/正在停靠/已驶出 各最近1趟（基于时刻表）
function showStationBoard(el, station) {
  if (!DATA || Object.keys(DATA).length === 0) {
    el.innerHTML = '<p class="error-msg">当前模式暂无运行图，请先导入</p>';
    return;
  }
  const queryTime = getQueryTime();
  if (!queryTime) {
    el.innerHTML = '<p class="error-msg">请先选择小时；只选择小时会按整点查询</p>';
    return;
  }
  const qs = queryTime.sec;
  const nt = queryTime.custom ? queryTime.text : queryTime.text.slice(0, 5);

  // 支持“23:59到站、00:00发车”这种跨零点停站
  function isStoppingAt(sec, r) {
    const a = toSec(r.a), p = toSec(r.p);
    return a <= p ? (a <= sec && sec <= p) : (sec >= a || sec <= p);
  }

  function isStopping(r) {
    if (!queryTime.custom) return isStoppingAt(qs, r);
    // 选择到“分”时，只要列车在这一分钟内到达或停靠，就算该分钟正在停靠
    const minuteEnd = (qs + 59) % 86400;
    const arrivalDistance = (toSec(r.a) - qs + 86400) % 86400;
    return isStoppingAt(qs, r) || isStoppingAt(minuteEnd, r) || arrivalDistance <= 59;
  }

  function forwardDistance(t) {
    return (toSec(t) - qs + 86400) % 86400;
  }

  function backwardDistance(t) {
    return (qs - toSec(t) + 86400) % 86400;
  }

  function dirData(d) {
    // 收集该站该方向所有停靠记录
    const recs = [];
    for (const t in DATA) {
      for (const r of DATA[t]) {
        if (r.s === station && r.d === d) recs.push(r);
      }
    }
    let stop=null, app=null, leave=null;
    let stopDistance=Infinity, appDistance=Infinity, leaveDistance=Infinity;
    for (const r of recs) {
      if (isStopping(r)) {
        const sd = isStoppingAt(qs, r) ? 0 : forwardDistance(r.a);
        if (sd < stopDistance) { stopDistance = sd; stop = r; }
      }
    }
    for (const r of recs) {
      if (r === stop) continue;
      const ad = forwardDistance(r.a);
      if (ad > 0 && ad < appDistance) { appDistance = ad; app = r; }
      const ld = backwardDistance(r.p);
      if (ld > 0 && ld < leaveDistance) { leaveDistance = ld; leave = r; }
    }
    return { stop, app, leave };
  }

  function trainCell(r, type) {
    if (!r) return '<div class="bd-empty">—</div>';
    const shortTime = t => String(t || '').slice(0, 5);
    const tableNumber = String(r.t || '').trim();
    const tableControl = /^\d{1,3}$/.test(tableNumber)
      ? '<button type="button" class="bd-table bd-table-btn" onclick="prepareTableQuery(\'' + tableNumber + '\')">表' + tableNumber + '</button>'
      : '<span class="bd-table">表' + tableNumber + '</span>';
    let extra = '';
    if (type === 'app')   extra = '<span class="bd-sub">到 ' + shortTime(r.a) + '</span>';
    if (type === 'leave') extra = '<span class="bd-sub">发 ' + shortTime(r.p) + '</span>';
    if (type === 'stop')  extra = '<span class="bd-sub">' + shortTime(r.a) + ' 到 / ' + shortTime(r.p) + ' 发</span>';
    return '<div class="bd-train">' +
           tableControl +
           '<span class="bd-no">'+r.c+'</span>' + extra + '</div>';
  }

  const up = dirData('up');
  const down = dirData('down');
  const boardName = queryTime.custom ? '指定时间看板' : '实时看板';


  el.innerHTML =
    '<div class="divider"></div>' +
    '<div class="bd-title">🚉 '+station+' '+boardName+' <span class="bd-time">'+nt+'</span></div>' +
    '<div class="bd-grid">' +
      '<div class="bd-col-head bd-up">上行</div>' +
      '<div class="bd-col-head bd-down">下行</div>' +
      '<div class="bd-sec-t bd-grid-label">↓ 即将到达</div><div class="bd-sec-t bd-grid-label">↓ 即将到达</div>' +
      '<div class="bd-cell">'+trainCell(up.app,'app')+'</div><div class="bd-cell">'+trainCell(down.app,'app')+'</div>' +
      '<div class="bd-sec-t bd-grid-label">● 正在停靠（已到达）</div><div class="bd-sec-t bd-grid-label">● 正在停靠（已到达）</div>' +
      '<div class="bd-cell">'+trainCell(up.stop,'stop')+'</div><div class="bd-cell">'+trainCell(down.stop,'stop')+'</div>' +
      '<div class="bd-sec-t bd-grid-label">↑ 已驶出</div><div class="bd-sec-t bd-grid-label">↑ 已驶出</div>' +
      '<div class="bd-cell">'+trainCell(up.leave,'leave')+'</div><div class="bd-cell">'+trainCell(down.leave,'leave')+'</div>' +
    '</div>';
}

// 追加"表号/车次 到 指定站点"的时刻信息（上行/下行两列）
function appendStation(el, raw, station, queryType) {
  if (!station) return;
  let recs = [];
  if (queryType === 'train') {
    for (const t in DATA) {
      for (const r of DATA[t]) {
        if (r.c === raw && r.s === station) recs.push(r);
      }
    }
    // 加开车次
    if (recs.length === 0 && EXTRA && EXTRA[raw]) {
      for (const r of EXTRA[raw]) {
        if (r.s === station) recs.push(r);
      }
    }
  } else {
    const tableRecs = DATA[raw] || DATA[raw.padStart(2,'0')] || [];
    recs = tableRecs.filter(r => r.s === station);
  }
  recs.sort((a,b) => a.a < b.a ? -1 : (a.a > b.a ? 1 : 0));

  const label = queryType === 'train' ? ('车次 '+raw) : ('表号 '+raw);
  let html = '<div class="station-result"><div class="station-result-title">' +
             label + ' 到「' + station + '」的时刻</div>';

  if (recs.length === 0) {
    html += '<div class="sr-item" style="color:#a0aec0;">该' +
            (queryType==='train'?'车次':'表号') + '不经过 ' + station + ' 站</div>';
    html += '</div>';
    el.innerHTML += html;
    return;
  }

  const downs = recs.filter(r => r.d === 'down');
  const ups = recs.filter(r => r.d === 'up');

  // 找当前时间之后最早到达的一趟(上下行合起来)，用于高亮
  const selectedTime = getQueryTime();
  const nowS = selectedTime ? selectedTime.sec : nowSec();
  let nextRec = null, nextSec = Infinity;
  for (const r of recs) {
    const aSec = toSec(r.a);
    if (aSec > nowS && aSec < nextSec) { nextSec = aSec; nextRec = r; }
  }

  function colRows(list) {
    if (list.length === 0) return '<div class="bd-empty">—</div>';
    return list.map(r => {
      const hl = (r === nextRec) ? ' sr-next' : '';
      return '<div class="srcol-item' + hl + '">' +
        '<span class="srcol-time">' + r.a + '<span class="srcol-arrival">到达' + dispName(r.s) + '</span></span>' +
        '<span class="srcol-route">' + dispName(r.o) + '→' + dispName(r.e) + '</span>' +
      '</div>';
    }).join('');
  }

  html += '<div class="bd-cols">' +
    '<div class="bd-col"><div class="bd-col-head bd-up">上行</div>' + colRows(ups) + '</div>' +
    '<div class="bd-col"><div class="bd-col-head bd-down">下行</div>' + colRows(downs) + '</div>' +
    '</div>';
  html += '</div>';
  el.innerHTML += html;
}

function query(openResultPage = true) {
  pendingResultPageOpen = !!openResultPage;
  setQueryPageMessage();
  const raw = document.getElementById('tableInput').value.trim();
  const el  = document.getElementById('result');
  const hint = document.getElementById('hint');
  hint.style.display = 'none';

  if (!raw) {
    const stationSel0 = document.getElementById('stationSelect');
    const station0 = stationSel0 ? stationSel0.value : '';
    if (station0) {
      hasActiveQuery = true;
      showStationBoard(el, station0);
    } else {
      hasActiveQuery = false;
      el.innerHTML = '';
      hint.style.display = 'block';
    }
    return;
  }

  if (!/^[0-9]{1,4}$/.test(raw)) {
    hasActiveQuery = false;
    el.innerHTML = '<p class="error-msg">请输入1～3位表号或4位车次，只能使用数字</p>';
    return;
  }
  hasActiveQuery = true;

  // 尝试原始输入 / 补零两位
  const stationSel = document.getElementById('stationSelect');
  const station = stationSel ? stationSel.value : '';

  if (!DATA || Object.keys(DATA).length === 0) {
    el.innerHTML = '<p class="error-msg">当前模式暂无运行图，请先点下方按钮导入</p>';
    return;
  }

  const queryTime = getQueryTime();
  if (!queryTime) {
    el.innerHTML = '<p class="error-msg">请先选择小时；只选择小时会按整点查询</p>';
    return;
  }

  // 自动判断：4位数=车次，2~3位数=表号
  let records = null;
  // 出入库信息需要整张车表；车次查询仍只用该车次的记录判断当前位置。
  let depotRecords = null;
  let linkedTableNumbers = [];
  let queryType = '';
  let queryLabel = '';
  if (/^[0-9]{4}$/.test(raw)) {
    // 车次查询：先在表号数据里找，再在加开车次(无表号)里找
    queryType = 'train';
    queryLabel = '车次 ' + raw;
    const found = [];
    for (const t in DATA) {
      for (const r of DATA[t]) {
        if (r.c === raw) found.push(r);
      }
    }
    let isExtra = false;
    if (found.length === 0 && EXTRA && EXTRA[raw]) {
      for (const r of EXTRA[raw]) found.push(r);
      isExtra = true;
    }
    if (found.length === 0) {
      el.innerHTML = '<p class="error-msg">未找到车次「'+raw+'」的数据</p>';
      return;
    }
    // 普通车次可由记录中的表号反查整张车表，从而显示与表号查询相同的
    // 全日出库/回库信息。无表号的加开车次则保留自身记录作为后备。
    linkedTableNumbers = [...new Set(
      found.map(r => String(r.t || '').trim()).filter(Boolean)
    )];
    const linkedTableRecords = linkedTableNumbers.flatMap(t =>
      DATA[t] || DATA[t.padStart(2, '0')] || []
    );
    depotRecords = linkedTableRecords.length ? linkedTableRecords : found;
    found.sort((a,b) => a.a < b.a ? -1 : (a.a > b.a ? 1 : 0));
    records = found;
    window.__isExtraTrain = isExtra;
  } else {
    // 表号查询
    queryType = 'table';
    queryLabel = '表号 ' + raw;
    records = DATA[raw] || DATA[raw.padStart(2,'0')] || null;
    if (!records || records.length === 0) {
      el.innerHTML = '<p class="error-msg">未找到表号「'+raw+'」的数据</p>';
      return;
    }
    depotRecords = records;
  }

  const resultQueryTag = queryType === 'train'
    ? ('车次 ' + raw + (window.__isExtraTrain ? ' · 无表号' : ''))
    : ('表号 ' + raw);
  const resultSubject = queryType === 'train' ? '车次' : '表号';
  function resultQueryTagFor(rec) {
    if (queryType === 'train') return resultQueryTag;
    const trainNumber = String(rec && rec.c || '').trim();
    return resultQueryTag + (trainNumber ? ' · 车次 ' + trainNumber : '');
  }
  const linkedTableButtons = queryType === 'train'
    ? linkedTableNumbers
        .filter(t => /^\d{1,3}$/.test(t))
        .map(t => '<button type="button" class="linked-table-btn" onclick="queryLinkedTable(\'' + t + '\')">' + t + '号表</button>')
        .join('')
    : '';
  function resultMetaRow(statusClass, statusText, rec) {
    return '<div class="result-meta-row">' +
      '<div class="query-tag">' + resultQueryTagFor(rec) + '</div>' +
      '<div class="result-badge ' + statusClass + '">' + statusText + '</div>' +
      linkedTableButtons +
    '</div>';
  }

  const ns = queryTime.sec, nt = queryTime.text;

  // 当日首班出库：第一条从车辆段始发的出库记录
  let firstDepartIdx = -1;
  for (let k = 0; k < records.length; k++) {
    if (isDepot(records[k].o) && records[k].s === records[k].o) { firstDepartIdx = k; break; }
  }
  const firstDepartSec = firstDepartIdx >= 0 ? toSec(records[firstDepartIdx].p) : -1;
  const firstDepartRec = firstDepartIdx >= 0 ? records[firstDepartIdx] : null;

  // 运营结束记录：优先取"首班出库之前的回库点"(跨日末班)，否则取全表最后一个回库点
  let endReturnRec = null;
  for (let k = 0; k < firstDepartIdx; k++) {
    if (isDepot(records[k].s) && records[k].e === records[k].s) endReturnRec = records[k];
  }
  if (!endReturnRec) {
    for (let k = 0; k < records.length; k++) {
      if (isDepot(records[k].s) && records[k].e === records[k].s) endReturnRec = records[k];
    }
  }
  // 出入库小字信息：按时间顺序列出全部出库/回库，用简称
  let depotInfo = '';
  {
    function shortDepot(n){
      if (n === '四惠段二' || n === '四惠段一') return '四惠段';
      if (n === '土桥车辆段') return '土桥段';
      if (n === '古段') return '古段';
      return n;
    }
    const events = [];
    const seenEvents = new Set();
    let depotFirstDepartSec = -1;
    for (const rec of (depotRecords || records)) {
      if (isDepot(rec.o) && rec.s === rec.o) {
        const eventKey = 'out|' + rec.o + '|' + rec.p;
        if (depotFirstDepartSec < 0) depotFirstDepartSec = toSec(rec.p);
        if (!seenEvents.has(eventKey)) {
          seenEvents.add(eventKey);
          events.push({ t: toSec(rec.p), html: shortDepot(rec.o) + ' ' + rec.p + ' 出库' });
        }
      }
      if (isDepot(rec.s) && rec.e === rec.s) {
        const eventKey = 'in|' + rec.e + '|' + rec.a;
        if (!seenEvents.has(eventKey)) {
          seenEvents.add(eventKey);
          events.push({ t: toSec(rec.a), html: shortDepot(rec.e) + ' ' + rec.a + ' 回库' });
        }
      }
    }
    // 以首班出库为运营周期起点：早于首班出库的事件(跨日凌晨回库)排到最后
    const fdSec = depotFirstDepartSec >= 0 ? depotFirstDepartSec : 0;
    events.sort((a,b) => {
      const ka = a.t < fdSec ? a.t + 86400 : a.t;
      const kb = b.t < fdSec ? b.t + 86400 : b.t;
      return ka - kb;
    });
    if (events.length) {
      depotInfo = '<div class="depot-info">' + events.map(e => e.html).join('　·　') + '</div>';
    }
  }

  // 指定时间只有“时、分”时，若这一整分钟内发生到站或停靠，优先显示该站。
  // 这样 05:20:15 到站的列车在查询 05:20 时不会被误判为仍在前一区间。
  function isStoppingForQuery(arrivalSec, departSec) {
    if (!queryTime.custom) return isTimeInRange(ns, arrivalSec, departSec);
    const minuteEnd = (ns + 59) % 86400;
    const arrivalDistance = (arrivalSec - ns + 86400) % 86400;
    return isTimeInRange(ns, arrivalSec, departSec) ||
           isTimeInRange(minuteEnd, arrivalSec, departSec) ||
           arrivalDistance <= 59;
  }
  const preferredMinuteStop = queryTime.custom
    ? records.find(rec => isStoppingForQuery(toSec(rec.a), toSec(rec.p)))
    : null;

  for (let i = 0; i < records.length; i++) {
    const r = records[i];
    const as = toSec(r.a), ds = toSec(r.p);

    // 该分钟内存在到站/停靠时，先跳到该记录，避免前一段区间提前返回。
    if (preferredMinuteStop && r !== preferredMinuteStop) continue;

    // 停靠在站
    if (isStoppingForQuery(as, ds)) {
      const atDepot = isDepot(r.s);
      el.innerHTML = `
        <div class="divider"></div>
        ${resultMetaRow(
          atDepot ? 'badge-depot' : 'badge-stopping',
          atDepot ? (queryTime.custom ? '■ 位于车辆段' : '■ 当前位于车辆段') : (queryTime.custom ? '● 停靠车站' : '● 当前停靠'),
          r
        )}
        <div class="big-station">${dispName(r.s)}</div>
        <div class="route-row">
          ${dirTag(r.d)} ${dispName(r.o)} <span class="route-arrow">→</span> ${dispName(r.e)}
        </div>
        <div class="time-info">
          <div class="time-row"><span>到站</span><span class="time-val">${r.a}</span></div>
          <div class="time-row"><span>发车</span><span class="time-val">${r.p}</span></div>
          <div class="time-row"><span>查询时刻</span><span class="time-val">${nt}</span></div>
        </div>${depotInfo}`;
      appendStation(el, raw, station, queryType);
      return;
    }

    // 已回库判定：当前记录是某车辆段的回库点(终到该段)，且此刻在回库~下次发车之间
    if (i+1 < records.length && isDepot(r.s) && r.e === r.s && ns > ds && ns < toSec(records[i+1].a)) {
      const nx = records[i+1];
      // 跨日判定：若该回库发生在当日首班出库之前，属于前一日收尾，显示"不在运营·等待出库"
      if (firstDepartSec >= 0 && ds < firstDepartSec) {
        const sd = firstDepartRec && isDepot(firstDepartRec.o) ? ('（' + dispName(firstDepartRec.o) + '发车）') : '';
        const ed = endReturnRec ? ('（回' + dispName(endReturnRec.e) + '）') : '';
        const endTime = endReturnRec ? endReturnRec.a : records[records.length-1].p;
        el.innerHTML = `
          <div class="divider"></div>
          ${resultMetaRow('badge-depot', '■ 位于车辆段')}
          <div class="big-station">${dispName(firstDepartRec.o)}</div>
          <p style="color:#4a5568;font-size:15px;margin-bottom:8px;">${resultSubject} <strong>${raw}</strong> 在 ${nt} 等待出库</p>
          <div class="time-info">
            <div class="time-row"><span>运营开始${sd}</span><span class="time-val">${firstDepartRec.p}</span></div>
            <div class="time-row"><span>运营结束${ed}</span><span class="time-val">${endTime}</span></div>
          </div>${depotInfo}`;
        appendStation(el, raw, station, queryType);
        return;
      }
      // 出库时刻 = 下一条记录的发点(即该车下次从段内出发)
      el.innerHTML = `
        <div class="divider"></div>
        ${resultMetaRow('badge-depot', '■ 车辆已回库')}
        <div class="big-station">${dispName(r.s)}</div>
        <div class="time-info">
          <div class="time-row"><span>回库时刻</span><span class="time-val">${r.a}</span></div>
          <div class="time-row"><span>出库时刻</span><span class="time-val">${nx.p}</span></div>
          <div class="time-row"><span>查询时刻</span><span class="time-val">${nt}</span></div>
        </div>${depotInfo}`;
      appendStation(el, raw, station, queryType);
      return;
    }

    // 区间运行
    if (i+1 < records.length) {
      const nx = records[i+1];
      if (ns > ds && ns < toSec(nx.a)) {
        let dispFromSta = r.s, dispToSta = nx.s;
        let dispFromTime = r.p, dispToTime = nx.a;
        // 特殊：洞口→洞口(古城出库轧道车在洞口折返) → 显示"古段→苹果园"(经dispName转古城车辆段)
        if (r.s === '洞口' && nx.s === '洞口') {
          // 起点向前找非洞口站(应为古段)，终点向后找非洞口站(应为苹果园)
          for (let k=i; k>=0; k--){ if(records[k].s !== '洞口'){ dispFromSta=records[k].s; dispFromTime=records[k].p; break; } }
          for (let k=i+1; k<records.length; k++){ if(records[k].s !== '洞口'){ dispToSta=records[k].s; dispToTime=records[k].a; break; } }
        } else {
          // 洞口透明化：洞口只是经过点，非始发/终到时不显示为区间端点，用两侧相邻站相连
          if (r.s === '洞口' && r.o !== '洞口' && r.e !== '洞口') {
            for (let k=i; k>=0; k--){ if(records[k].s !== '洞口'){ dispFromSta=records[k].s; dispFromTime=records[k].p; break; } }
          }
          if (nx.s === '洞口' && nx.o !== '洞口' && nx.e !== '洞口') {
            for (let k=i+1; k<records.length; k++){ if(records[k].s !== '洞口'){ dispToSta=records[k].s; dispToTime=records[k].a; break; } }
          }
        }
        // 折返标注：同站名、前后方向不同、且非车辆段 → 标注上下行
        let fromTag = '', toTag = '';
        if (r.s === nx.s && r.d !== nx.d && !isDepot(r.s)) {
          fromTag = r.d === 'down' ? '（下行）' : '（上行）';
          toTag = nx.d === 'down' ? '（下行）' : '（上行）';
        }
        el.innerHTML = `
          <div class="divider"></div>
          ${resultMetaRow('badge-running', '▶ 区间运行中', r)}
          <div class="between-wrap">
            <div class="between-sta">${dispName(dispFromSta)}${fromTag}</div>
            <div class="between-icon">→</div>
            <div class="between-sta right">${dispName(dispToSta)}${toTag}</div>
          </div>
          <div class="route-row">
            ${dirTag(r.d)} ${dispName(r.o)} <span class="route-arrow">→</span> ${dispName(r.e)}
          </div>
          <div class="time-info">
            <div class="time-row"><span>离开 ${dispName(dispFromSta)}${fromTag}</span><span class="time-val">${dispFromTime}</span></div>
            <div class="time-row"><span>到达 ${dispName(dispToSta)}${toTag}</span><span class="time-val">${dispToTime}</span></div>
            <div class="time-row"><span>查询时刻</span><span class="time-val">${nt}</span></div>
          </div>${depotInfo}`;
        appendStation(el, raw, station, queryType);
        return;
      }
    }
  }

  // 处理午夜前最后一站到午夜后第一站之间的连续运行
  const lastRec = records[records.length - 1];
  const firstRec = records[0];
  const crossStart = toSec(lastRec.p);
  const crossEnd = toSec(firstRec.a);
  const crossGap = (crossEnd - crossStart + 86400) % 86400;
  if (crossGap > 0 && crossGap <= 2 * 3600 && isTimeInRange(ns, crossStart, crossEnd, false)) {
    el.innerHTML = `
      <div class="divider"></div>
      ${resultMetaRow('badge-running', '▶ 区间运行中', lastRec)}
      <div class="between-wrap">
        <div class="between-sta">${dispName(lastRec.s)}</div>
        <div class="between-icon">→</div>
        <div class="between-sta right">${dispName(firstRec.s)}</div>
      </div>
      <div class="route-row">
        ${dirTag(lastRec.d)} ${dispName(lastRec.o)} <span class="route-arrow">→</span> ${dispName(lastRec.e)}
      </div>
      <div class="time-info">
        <div class="time-row"><span>离开 ${dispName(lastRec.s)}</span><span class="time-val">${lastRec.p}</span></div>
        <div class="time-row"><span>到达 ${dispName(firstRec.s)}</span><span class="time-val">${firstRec.a}</span></div>
        <div class="time-row"><span>查询时刻</span><span class="time-val">${nt}</span></div>
      </div>${depotInfo}`;
    appendStation(el, raw, station, queryType);
    return;
  }

  // 末班已回库判定：最后一条是车辆段回库点，且当前时间晚于回库到点
  if (isDepot(lastRec.s) && lastRec.e === lastRec.s && ns > toSec(lastRec.a)) {
    el.innerHTML = `
      <div class="divider"></div>
      ${resultMetaRow('badge-depot', '■ 车辆已回库')}
      <div class="big-station">${dispName(lastRec.s)}</div>
      <div class="time-info">
        <div class="time-row"><span>回库时刻</span><span class="time-val">${lastRec.a}</span></div>
        <div class="time-row"><span>状态</span><span class="time-val">末班已回库</span></div>
        <div class="time-row"><span>查询时刻</span><span class="time-val">${nt}</span></div>
      </div>${depotInfo}`;
    appendStation(el, raw, station, queryType);
    return;
  }

  // 不在运营时间
  const first = records[0], last = records[records.length-1];
  // 运营开始：优先用首班出库点；运营结束：用 endReturnRec(含跨日末班回库)
  const startRec2 = firstDepartRec || first;
  const startDepot = isDepot(startRec2.o) ? ('（' + dispName(startRec2.o) + '发车）') : '';
  const startTime = firstDepartRec ? firstDepartRec.p : first.a;
  const endDepot = endReturnRec ? ('（回' + dispName(endReturnRec.e) + '）') : (isDepot(last.e) ? ('（回' + dispName(last.e) + '）') : '');
  const endTime2 = endReturnRec ? endReturnRec.a : last.p;
  el.innerHTML = `
    <div class="divider"></div>
    ${resultMetaRow('badge-none', '○ 不在运营时段')}
    <p style="color:#4a5568;font-size:15px;margin-bottom:8px;">${resultSubject} <strong>${raw}</strong> 在 ${nt} 无运行记录</p>
    <div class="time-info">
      <div class="time-row"><span>运营开始${startDepot}</span><span class="time-val">${startTime}</span></div>
      <div class="time-row"><span>运营结束${endDepot}</span><span class="time-val">${endTime2}</span></div>
    </div>${depotInfo}`;
  appendStation(el, raw, station, queryType);
}

document.getElementById('tableInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') query();
});

// 现有查询函数有多种成功出口。统一监听结果区，只在用户主动查询成功时翻到结果页。
(function bindResultPageTransition(){
  const result = document.getElementById('result');
  if (!result || typeof MutationObserver === 'undefined') return;
  const observer = new MutationObserver(() => {
    const error = result.querySelector('.error-msg');
    if (error) {
      setQueryPageMessage(error.textContent.trim());
      pendingResultPageOpen = false;
      return;
    }
    if (!pendingResultPageOpen) return;
    if (!result.textContent.trim()) {
      pendingResultPageOpen = false;
      return;
    }
    setQueryPageMessage();
    showResultPage();
  });
  observer.observe(result, { childList: true, subtree: true });
})();

window.addEventListener('orientationchange', () => {
  if (!isPortraitLayout()) document.body.classList.remove('result-page');
});

// iOS Safari 检测，显示安装提示
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone = window.navigator.standalone;
if (isIOS && !isStandalone) {
  document.getElementById('installBanner').style.display = 'block';
}

// 网络正常时自动更新；弱网或断网时由 Service Worker 快速回退到最近缓存版本
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
      .then(reg => reg.update())
      .catch(()=>{});
  });
}


// 按钮按压效果（JS控制，兼容Safari/Chrome，避免:active失效）
(function bindPressEffect(){
  function addPress(el){
    if (!el) return;
    const on = () => el.classList.add('pressed');
    const off = () => el.classList.remove('pressed');
    el.addEventListener('touchstart', on, {passive:true});
    el.addEventListener('touchend', off);
    el.addEventListener('touchcancel', off);
    el.addEventListener('mousedown', on);
    el.addEventListener('mouseup', off);
    el.addEventListener('mouseleave', off);
  }
  // 查询按钮 + 清空按钮（input-row 内的 button 和 .clear-btn）
  document.querySelectorAll('.input-row button, .clear-btn').forEach(addPress);
})();
